<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Math'as Tableau</title>
<link rel="icon" href="https://jftzuslpelgzbdrftszw.supabase.co/storage/v1/object/public/mathas-images/logos/logo-m-1791065253498-qussoz.png">
<style>
:root{
  --bg:#15242c;--bg2:#1c3039;--panel:#233842;--panel2:#29434e;--ink:#f4fbff;--muted:#b8cbd3;--line:#49636e;
  --add:#52c7ff;--add2:#2e83cf;--addmulti:#a88cff;--sub:#7fc875;--sub2:#c87947;--mul:#40c7bb;--mulmulti:#d06580;--mix:#7da9d6;
  --ok:#54c987;--bad:#d95d70;--warn:#d9aa4f;--white:#fff;
  --shadow:0 16px 38px rgba(0,0,0,.24);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;background:linear-gradient(145deg,var(--bg),var(--bg2));color:var(--ink)}
body{min-height:100vh;background-attachment:fixed}body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 12%,rgba(64,199,187,.09),transparent 22rem),radial-gradient(circle at 88% 25%,rgba(168,140,255,.08),transparent 24rem),repeating-linear-gradient(118deg,transparent 0 86px,rgba(255,255,255,.015) 87px 88px);z-index:-1}
button,input,select{font:inherit}.hidden{display:none!important}.app{width:min(1500px,calc(100% - 24px));margin:0 auto;padding:16px 0 34px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;min-height:58px}.wordmark{height:34px;max-width:180px;object-fit:contain}.top-title{font-size:1.05rem;font-weight:950;letter-spacing:.02em;color:#d8eaf0}.spacer{flex:1}.top-btn{border:1px solid #5e7580;background:#263c46;color:#f2fbff;border-radius:14px;padding:10px 15px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #14232b}.top-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14232b}
.panel{border:1px solid rgba(153,188,201,.26);background:linear-gradient(180deg,rgba(39,61,72,.93),rgba(29,47,57,.95));border-radius:26px;box-shadow:var(--shadow)}
.hero{padding:26px 28px;margin-bottom:18px}.hero h1{margin:0;font-size:clamp(2.2rem,4.5vw,4.5rem);line-height:.95;letter-spacing:-.045em}.hero p{margin:12px 0 0;color:var(--muted);font-size:1.05rem;font-weight:700}.version{font-size:.72rem;opacity:.58;font-weight:900;margin-top:8px}
.family-grid{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:16px}.family-card{position:relative;overflow:hidden;min-height:190px;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:22px;text-align:left;color:#fff;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.18);transition:.18s}.family-card:hover{transform:translateY(-2px);filter:brightness(1.05)}.family-card::after{content:"";position:absolute;right:-30px;bottom:-50px;width:150px;height:150px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}.family-card .sym{font-size:3.7rem;line-height:1;font-weight:1000}.family-card h2{margin:14px 0 5px;font-size:1.45rem}.family-card p{margin:0;color:rgba(255,255,255,.78);font-weight:700;line-height:1.35}.f-add{background:linear-gradient(145deg,#195b8c,#234866)}.f-addmulti{background:linear-gradient(145deg,#514183,#2f4068)}.f-sub{background:linear-gradient(145deg,#395f3a,#5a4931)}.f-mul{background:linear-gradient(145deg,#1d665f,#28525a)}.f-mulmulti{background:linear-gradient(145deg,#6c2e42,#4d2e49)}.f-mix{background:linear-gradient(145deg,#375d78,#51466f)}
.context-bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:16px 18px;margin-bottom:16px}.context-name{display:flex;align-items:center;gap:12px;min-width:0}.context-symbol{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:2rem;font-weight:1000;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}.context-name h2{margin:0;font-size:1.55rem}.context-name small{display:block;color:var(--muted);margin-top:3px;font-weight:750}.select-wrap{display:flex;align-items:center;gap:8px}.select-wrap label{font-size:.8rem;color:var(--muted);font-weight:900}.select-wrap select,.settings-btn{height:46px;border-radius:13px;border:1px solid #627b86;background:#1b303a;color:#f5fbff;padding:0 14px;font-weight:900}.settings-btn{cursor:pointer}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(300px,1fr));gap:16px}.mode-card{min-height:210px;border-radius:24px;padding:22px;border:1px solid rgba(255,255,255,.13);cursor:pointer;text-align:left;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}.mode-card::after{content:"";position:absolute;right:-34px;bottom:-46px;width:145px;height:145px;border-radius:50%;border:24px solid rgba(255,255,255,.055)}.mode-card .icon{font-size:2.5rem}.mode-card h3{font-size:1.5rem;margin:12px 0 5px}.mode-card p{margin:0;max-width:650px;color:rgba(255,255,255,.80);line-height:1.42;font-weight:700}.m-guide{background:linear-gradient(145deg,#235b65,#244c59)}.m-board{background:linear-gradient(145deg,#315c42,#34513f)}.m-transcribe{background:linear-gradient(145deg,#61502f,#59442f)}.m-list{background:linear-gradient(145deg,#58416d,#42425f)}
.screen-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.screen-head h2{margin:0;font-size:1.7rem}.screen-head .badge{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#d7e8ef;font-weight:900;font-size:.8rem}.screen-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.17);border-radius:15px;padding:11px 16px;color:#fff;font-weight:950;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.23)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.23)}.btn-secondary{background:#415865}.btn-success{background:linear-gradient(180deg,#2d9a63,#217448)}.btn-danger{background:linear-gradient(180deg,#ad3b50,#7d2638)}.btn-warn{background:linear-gradient(180deg,#98732c,#71521b)}.btn-blue{background:linear-gradient(180deg,#397fa8,#2a5e7e)}
.work-panel{padding:18px}.instruction{min-height:58px;border-radius:17px;border:1px solid rgba(132,177,197,.28);background:rgba(13,30,39,.52);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 18px;font-size:1.05rem;font-weight:850;color:#d9ebf2;margin-bottom:16px}.instruction strong{color:#fff}.board-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.exercise-card{border:1px solid rgba(255,255,255,.13);border-radius:22px;background:rgba(12,27,35,.60);padding:16px;min-width:0}.exercise-title{font-weight:1000;color:#d7e8ef;margin:0 0 10px;font-size:1rem}.exercise-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.status{min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;margin-top:8px}.status.ok{color:#9ef2bd}.status.bad{color:#ffb2be}
.written-wrap{overflow-x:auto;padding:4px 2px}.written{--cell:58px;--cols:4;display:grid;grid-template-columns:40px repeat(var(--cols),var(--cell));gap:5px;align-items:center;justify-content:center;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}.wcell{width:var(--cell);height:54px;display:grid;place-items:center;font-size:2rem;font-weight:1000}.wop{width:40px;text-align:center;font-size:2rem;font-weight:1000;color:#ffd77c}.carry-cell{width:38px;height:30px;border-radius:8px;border:2px solid rgba(230,184,76,.50);background:rgba(82,62,13,.28);color:#ffe8a5;text-align:center;font-weight:1000;outline:none}.carry-cell.helper{border-style:dashed;opacity:.72}.answer-cell{width:var(--cell);height:58px;border-radius:12px;border:2px solid rgba(102,184,220,.38);background:rgba(5,19,28,.84);color:#fff;text-align:center;font-size:1.75rem;font-weight:1000;outline:none;caret-color:transparent}.answer-cell.active{border-color:#59d8ff;box-shadow:0 0 0 5px rgba(89,216,255,.14)}.answer-cell.good{border-color:#61d596;background:rgba(32,102,65,.44)}.answer-cell.bad{border-color:#ea6a7e;background:rgba(115,35,49,.43)}.wline{grid-column:1/-1;height:3px;border-radius:99px;background:#7793a0;margin:2px 0}.partial-label{font-size:.72rem;color:#a9c1cb;text-align:right;padding-right:4px;font-weight:900}.guide-hint{margin:12px auto 0;max-width:850px;padding:12px 15px;border-radius:14px;background:#3d3116;border:1px solid #9a7b31;color:#ffe9ae;text-align:center;font-weight:900}.guide-row{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.bonus-area{margin-top:18px;border-top:1px solid rgba(255,255,255,.11);padding-top:15px}.bonus-area h3{margin:0 0 10px;color:#c9dde5;font-size:1rem}.bonus-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bonus-card{border:1px solid rgba(255,255,255,.10);border-radius:16px;background:rgba(255,255,255,.035);padding:12px}.bonus-exp{font-size:1.25rem;font-weight:1000}.bonus-controls{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.bonus-input{width:110px;height:42px;border-radius:11px;border:1px solid #68828d;background:#122932;color:white;text-align:center;font-weight:1000;font-size:1.15rem}
.transcribe-box{max-width:1000px;margin:0 auto}.transcribe-form{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:26px;border-radius:22px;background:rgba(11,27,35,.56);border:1px solid rgba(255,255,255,.12)}.big-input{width:min(360px,42vw);height:68px;border-radius:16px;border:2px solid #607c87;background:#132d36;color:#fff;text-align:center;font-size:1.75rem;font-weight:1000;outline:none}.big-input:focus{border-color:#67d0f5;box-shadow:0 0 0 5px rgba(103,208,245,.13)}.op-display{font-size:2.4rem;font-weight:1000;color:#ffd77c;min-width:54px;text-align:center}.op-select{height:58px;border-radius:14px;border:1px solid #6f8792;background:#18323c;color:#fff;font-size:1.5rem;font-weight:1000;padding:0 16px}.multi-inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}.multi-inputs .big-input{width:100%}.transcribe-result{margin-top:18px}
.list-panel{padding:20px}.list-tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.exercise-list{display:grid;grid-template-columns:1fr 1fr;gap:18px}.list-column{display:grid;gap:10px}.list-item{border:1px solid rgba(255,255,255,.12);background:rgba(16,33,42,.58);border-radius:16px;padding:13px 15px}.list-line{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:1000}.list-index{width:30px;color:#91acb7;font-size:.9rem}.inline-input{margin-left:auto;width:130px;height:42px;border-radius:10px;border:1px solid #64808c;background:#122831;color:#fff;text-align:center;font-weight:1000}.solution-zone{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.10)}.solution-zone .written{--cell:36px}.solution-zone .wcell{height:34px;font-size:1.25rem}.solution-zone .answer-cell{width:36px;height:34px;font-size:1.1rem}.solution-zone .carry-cell{width:26px;height:20px;font-size:.72rem}.solution-answer{font-size:1rem;color:#a8efc3;font-weight:1000;margin-top:6px;text-align:center}
.settings-modal{position:fixed;inset:0;z-index:50;background:rgba(4,12,17,.72);display:grid;place-items:center;padding:16px}.settings-card{width:min(720px,100%);border-radius:24px;border:1px solid #66808b;background:linear-gradient(180deg,#29414c,#20343e);padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.5)}.settings-card h3{margin:0 0 8px;font-size:1.5rem}.settings-card p{color:var(--muted);margin:0 0 16px}.setting-group{border-top:1px solid rgba(255,255,255,.11);padding-top:14px;margin-top:14px}.setting-group h4{margin:0 0 10px}.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.radio-card{display:flex;gap:9px;align-items:flex-start;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);cursor:pointer}.radio-card input{margin-top:3px}.radio-card strong{display:block}.radio-card span{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}.settings-actions{display:flex;justify-content:flex-end;margin-top:18px}
.bravo{position:fixed;inset:0;z-index:80;pointer-events:none;display:grid;place-items:center;background:rgba(3,12,16,.18)}.bravo-card{padding:22px 34px;border-radius:24px;background:#215a3d;border:2px solid #63d092;color:white;font-size:2.1rem;font-weight:1000;box-shadow:0 18px 50px rgba(0,0,0,.36);animation:pop .8s ease both}@keyframes pop{0%{transform:scale(.7);opacity:0}35%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@media(max-width:1000px){.family-grid{grid-template-columns:repeat(2,1fr)}.mode-grid,.board-two,.exercise-list{grid-template-columns:1fr}.context-bar{grid-template-columns:1fr}.select-wrap{justify-content:flex-start}.bonus-grid{grid-template-columns:1fr}.multi-inputs{grid-template-columns:1fr}.big-input{width:min(100%,420px)}.radio-grid{grid-template-columns:1fr}}
@media(max-width:640px){.family-grid{grid-template-columns:1fr}.app{width:min(100% - 12px,1500px)}.hero{padding:20px}.topbar{flex-wrap:wrap}.wordmark{height:28px}.family-card{min-height:160px}.wcell{font-size:1.55rem}.written{--cell:47px}.answer-cell{height:50px;font-size:1.45rem}.screen-head{align-items:flex-start;flex-wrap:wrap}.screen-actions{width:100%;margin-left:0}.btn{flex:1}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar"><img class="wordmark" src="https://jftzuslpelgzbdrftszw.supabase.co/storage/v1/object/public/mathas-images/logos/logo-mot-1791065255634-jznxux.png" alt="Math'as"><div class="top-title">Version Tableau</div><div class="spacer"></div><button id="homeBtn" class="top-btn hidden">⌂ Accueil</button><button id="fullBtn" class="top-btn">⛶ Plein écran</button></div>

  <section id="hubScreen">
    <div class="panel hero"><h1>Math’as Tableau</h1><p>Choisis le type de calcul à travailler avec la classe.</p><div class="version">V1 beta</div></div>
    <div class="family-grid" id="familyGrid"></div>
  </section>

  <section id="modeScreen" class="hidden">
    <div class="panel context-bar"><div class="context-name"><div id="contextSymbol" class="context-symbol"></div><div><h2 id="contextTitle"></h2><small>Choisis comment utiliser ce calcul au tableau.</small></div></div><div class="select-wrap"><label for="levelSelect">Niveau</label><select id="levelSelect"><option value="1">Niveau 1</option><option value="2">Niveau 2</option><option value="3">Niveau 3</option><option value="hard">Difficile</option></select></div><button id="settingsBtn" class="settings-btn">⚙ Réglages</button></div>
    <div class="mode-grid">
      <button class="mode-card m-guide" data-mode="guided"><div class="icon">🧭</div><h3>Exercice guidé</h3><p>Un calcul expliqué étape par étape, avec les mêmes mécanismes de calcul écrit.</p></button>
      <button class="mode-card m-board" data-mode="board"><div class="icon">🖍️</div><h3>Faire au tableau</h3><p>Deux calculs interactifs pour la classe, plus deux bonus plus rapides en dessous.</p></button>
      <button class="mode-card m-transcribe" data-mode="transcribe"><div class="icon">✍️</div><h3>Retranscription</h3><p>Écris toi-même les nombres, puis transforme-les immédiatement en calcul écrit interactif.</p></button>
      <button class="mode-card m-list" data-mode="list"><div class="icon">📋</div><h3>Donner des exercices</h3><p>Dix exercices en deux colonnes. Correction complète, une colonne à la fois.</p></button>
    </div>
  </section>

  <section id="workScreen" class="hidden">
    <div class="screen-head"><h2 id="workTitle"></h2><span id="workBadge" class="badge"></span><div class="screen-actions"><button id="newBtn" class="btn btn-blue">↻ Nouveau</button><button id="backModesBtn" class="btn btn-secondary">← Menu du calcul</button></div></div>
    <div id="workContent"></div>
  </section>
</main>

<div id="settingsModal" class="settings-modal hidden"><div class="settings-card"><h3>Réglages pédagogiques</h3><p>Ces choix ne sont pas enregistrés : ils valent seulement pour cette séance.</p><div id="settingsBody"></div><div class="settings-actions"><button id="closeSettings" class="btn btn-success">Fermer</button></div></div></div>
<div id="bravo" class="bravo hidden"><div class="bravo-card">Bravo ! ✓</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const families={
 add:{name:'Addition',symbol:'+',desc:'Addition simple de deux nombres.',cls:'f-add',accent:'#52c7ff'},
 addmulti:{name:'Addition de plusieurs nombres',symbol:'+',desc:'Addition posée avec plusieurs termes.',cls:'f-addmulti',accent:'#a88cff'},
 sub:{name:'Soustraction',symbol:'−',desc:'Soustraction écrite avec emprunts.',cls:'f-sub',accent:'#7fc875'},
 mul:{name:'Multiplication à 1 chiffre',symbol:'×',desc:'Multiplication posée par un chiffre.',cls:'f-mul',accent:'#40c7bb'},
 mulmulti:{name:'Multiplication à plusieurs chiffres',symbol:'×',desc:'Produits partiels puis addition finale.',cls:'f-mulmulti',accent:'#d06580'},
 mix:{name:'Mélange',symbol:'±×',desc:'Addition, soustraction ou multiplication.',cls:'f-mix',accent:'#7da9d6'}
};
const state={family:null,level:'1',mode:null,subMethod:'addBottom',mulMethod:'top',guided:null,transcribed:null,list:[]};
const levelDigits={1:3,2:4,3:6,hard:12};
const multiSpecs={1:[3,2],2:[4,2],3:[5,3],hard:[7,3]};

function randint(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function nDigits(d){if(d<=1)return randint(2,9);return randint(10**(d-1),10**d-1)}
function maybeShort(d){return d>1&&Math.random()<.15?d-1:d}
function familyColor(key){return families[key]?.accent||'#7da9d6'}
function fmt(n){return String(n)}
function resultOf(ex){if(ex.op==='add')return ex.terms.reduce((a,b)=>a+b,0);if(ex.op==='sub')return ex.a-ex.b;return ex.a*ex.b}
function inlineText(ex,answer=false){let s;if(ex.op==='add')s=ex.terms.join(' + ');else s=`${ex.a} ${ex.op==='sub'?'−':'×'} ${ex.b}`;return `${s}${answer?' = '+resultOf(ex):' ='}`}
function opName(op){return op==='add'?'addition':op==='sub'?'soustraction':'multiplication'}

function genExercise(fam=state.family, level=state.level){
 if(fam==='mix'){const choices=['add','sub','mul'];const op=choices[randint(0,2)];return genByOp(op,level)}
 if(fam==='add')return genByOp('add',level);
 if(fam==='addmulti'){
   const d=level==='hard'?12:levelDigits[level];const counts={1:3,2:4,3:5,hard:6};const c=counts[level];
   return {op:'add',terms:Array.from({length:c},()=>nDigits(maybeShort(d))),family:fam};
 }
 if(fam==='sub')return genByOp('sub',level);
 if(fam==='mul')return genByOp('mul',level);
 if(fam==='mulmulti'){
   const [da,db]=multiSpecs[level];return {op:'mul',a:nDigits(maybeShort(da)),b:nDigits(db),family:fam,multi:true};
 }
 return genByOp('add',level)
}
function genByOp(op,level){
 const d=level==='hard'?12:levelDigits[level];
 if(op==='add')return {op:'add',terms:[nDigits(maybeShort(d)),nDigits(maybeShort(d))],family:'add'};
 if(op==='sub'){let a=nDigits(maybeShort(d)),b=nDigits(maybeShort(d));if(b>a)[a,b]=[b,a];if(a===b)a+=randint(1,9);return {op:'sub',a,b,family:'sub'};}
 const a=nDigits(maybeShort(d)),b=randint(2,9);return {op:'mul',a,b,family:'mul'};
}

function buildHub(){const g=$('familyGrid');g.innerHTML='';Object.entries(families).forEach(([key,f])=>{const b=document.createElement('button');b.className=`family-card ${f.cls}`;b.innerHTML=`<div class="sym">${f.symbol}</div><h2>${f.name}</h2><p>${f.desc}</p>`;b.onclick=()=>chooseFamily(key);g.appendChild(b)})}
function show(screen){['hubScreen','modeScreen','workScreen'].forEach(id=>$(id).classList.toggle('hidden',id!==screen));$('homeBtn').classList.toggle('hidden',screen==='hubScreen')}
function chooseFamily(key){state.family=key;state.mode=null;$('contextSymbol').textContent=families[key].symbol;$('contextSymbol').style.color=familyColor(key);$('contextTitle').textContent=families[key].name;$('levelSelect').value=state.level;$('settingsBtn').classList.toggle('hidden',!settingsVisible());show('modeScreen')}
function goHome(){state.family=null;state.mode=null;show('hubScreen')}
function backModes(){show('modeScreen')}
function openMode(mode){state.mode=mode;$('workTitle').textContent=`${families[state.family].name} — ${modeLabel(mode)}`;$('workBadge').textContent=levelLabel(state.level);show('workScreen');renderMode()}
function modeLabel(m){return {guided:'Exercice guidé',board:'Faire au tableau',transcribe:'Retranscription',list:'Donner des exercices'}[m]}
function levelLabel(l){return l==='hard'?'Difficile':`Niveau ${l}`}

function settingsVisible(){return ['sub','mul','mulmulti','mix'].includes(state.family)}
function renderSettings(){const body=$('settingsBody');body.innerHTML='';if(['sub','mix'].includes(state.family)){body.insertAdjacentHTML('beforeend',`<div class="setting-group"><h4>Technique de soustraction</h4><div class="radio-grid"><label class="radio-card"><input type="radio" name="subm" value="addBottom" ${state.subMethod==='addBottom'?'checked':''}><div><strong>Petit 1 en bas</strong><span>10 au-dessus, puis petit 1 sur le chiffre du bas suivant.</span></div></label><label class="radio-card"><input type="radio" name="subm" value="takeTop" ${state.subMethod==='takeTop'?'checked':''}><div><strong>−1 en haut</strong><span>Le chiffre donneur est diminué d'une unité.</span></div></label></div></div>`)}
 if(['mul','mulmulti','mix'].includes(state.family)){body.insertAdjacentHTML('beforeend',`<div class="setting-group"><h4>Reports de multiplication</h4><div class="radio-grid"><label class="radio-card"><input type="radio" name="mulm" value="top" ${state.mulMethod==='top'?'checked':''}><div><strong>Report au-dessus</strong><span>La retenue se place au-dessus du chiffre suivant.</span></div></label><label class="radio-card"><input type="radio" name="mulm" value="side" ${state.mulMethod==='side'?'checked':''}><div><strong>Report à côté</strong><span>Le report reste dans une case séparée.</span></div></label></div></div>`)}
 body.querySelectorAll('input[name="subm"]').forEach(x=>x.onchange=()=>state.subMethod=x.value);body.querySelectorAll('input[name="mulm"]').forEach(x=>x.onchange=()=>state.mulMethod=x.value)
}

function arraysForStandard(ex){
 const operands=ex.op==='add'?ex.terms:[ex.a,ex.b];const res=resultOf(ex);const cols=Math.max(...operands.map(n=>String(n).length),String(res).length);return {operands,res,cols};
}
function digitRow(n,cols){const s=String(n).padStart(cols,' ');return [...s]}
function additionCarries(terms,cols){const rows=terms.map(n=>String(n).padStart(cols,'0').split('').map(Number));const carry=Array(cols).fill('');let c=0;for(let i=cols-1;i>=0;i--){const sum=rows.reduce((a,r)=>a+r[i],c);const next=Math.floor(sum/10);if(i>0&&next)carry[i-1]=String(next);c=next}return carry}
function mulCarries(a,b,cols){const digs=String(a).padStart(cols,'0').split('').map(Number);const carry=Array(cols).fill('');let c=0;for(let i=cols-1;i>=0;i--){const t=digs[i]*b+c;const next=Math.floor(t/10);if(i>0&&next)carry[i-1]=String(next);c=next}return carry}
function subBorrowHints(a,b,cols){const top=String(a).padStart(cols,'0').split('').map(Number),bot=String(b).padStart(cols,'0').split('').map(Number);const notes=Array(cols).fill('');let work=[...top];for(let i=cols-1;i>0;i--){if(work[i]<bot[i]){let j=i-1;while(j>=0&&work[j]===0){j--}if(j>=0){work[j]--;for(let k=j+1;k<i;k++)work[k]=9;work[i]+=10;notes[i]=String(work[i]);notes[j]=String(work[j])}}}return notes}

function renderStandard(ex,interactive=true,compact=false){
 const {operands,res,cols}=arraysForStandard(ex);let html=`<div class="written" style="--cols:${cols}">`;
 let helpers=Array(cols).fill('');if(ex.op==='add')helpers=additionCarries(operands,cols);else if(ex.op==='mul')helpers=mulCarries(ex.a,ex.b,cols);else helpers=subBorrowHints(ex.a,ex.b,cols);
 html+=`<div></div>`+helpers.map(v=>interactive?`<input class="carry-cell helper" inputmode="numeric" maxlength="2" value="">`:`<div class="carry-cell" style="display:grid;place-items:center">${v}</div>`).join('');
 operands.forEach((n,ri)=>{const sign=ri===operands.length-1?(ex.op==='add'?'+':ex.op==='sub'?'−':'×'):'';html+=`<div class="wop">${sign}</div>`+digitRow(n,cols).map(d=>`<div class="wcell">${d===' '?'':d}</div>`).join('')});
 html+=`<div class="wline"></div><div></div>`;const ans=String(res).padStart(cols,' ');[...ans].forEach(ch=>{html+=interactive?`<input class="answer-cell" inputmode="numeric" maxlength="1" data-expected="${ch===' '?'':ch}">`:`<div class="wcell">${ch===' '?'':ch}</div>`});html+='</div>';return html;
}
function renderMultiMul(ex,interactive=true){
 const aS=String(ex.a),bS=String(ex.b),res=String(resultOf(ex));const partials=[...bS].reverse().map((d,i)=>ex.a*Number(d)*10**i);const cols=Math.max(res.length,aS.length,bS.length);let html=`<div class="written" style="--cols:${cols}">`;
 html+=`<div></div>`+Array.from({length:cols},()=>interactive?`<input class="carry-cell helper" inputmode="numeric" maxlength="2">`:`<div></div>`).join('');
 html+=`<div></div>`+digitRow(ex.a,cols).map(d=>`<div class="wcell">${d===' '?'':d}</div>`).join('');html+=`<div class="wop">×</div>`+digitRow(ex.b,cols).map(d=>`<div class="wcell">${d===' '?'':d}</div>`).join('');html+=`<div class="wline"></div>`;
 partials.forEach((p,idx)=>{const ps=String(p).padStart(cols,' ');html+=`<div class="partial-label">${idx+1}</div>`+[...ps].map(ch=>interactive?`<input class="answer-cell partial" inputmode="numeric" maxlength="1" data-expected="${ch===' '?'':ch}">`:`<div class="wcell">${ch===' '?'':ch}</div>`).join('')});
 if(partials.length>1)html+=`<div class="wline"></div>`;html+=`<div class="wop">=</div>`+[...res.padStart(cols,' ')].map(ch=>interactive?`<input class="answer-cell final" inputmode="numeric" maxlength="1" data-expected="${ch===' '?'':ch}">`:`<div class="wcell">${ch===' '?'':ch}</div>`).join('');html+='</div>';return html;
}
function renderWritten(ex,interactive=true){return ex.multi?renderMultiMul(ex,interactive):renderStandard(ex,interactive)}
function bindDigits(root){root.querySelectorAll('.answer-cell,.carry-cell').forEach(inp=>{inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-2);if(inp.classList.contains('answer-cell'))inp.value=inp.value.slice(-1)})})}
function checkExercise(card,celebrate=true){const ans=[...card.querySelectorAll('.answer-cell[data-expected]')];let complete=true,ok=true;ans.forEach(inp=>{const exp=inp.dataset.expected;if(exp===''){inp.classList.remove('bad','good');return}if(inp.value===''){complete=false;inp.classList.remove('bad','good')}else if(inp.value===exp){inp.classList.add('good');inp.classList.remove('bad')}else{ok=false;inp.classList.add('bad');inp.classList.remove('good')}});const st=card.querySelector('.status');if(!complete){if(st){st.textContent='Complète d’abord toutes les cases du résultat.';st.className='status bad'}return false}if(ok){if(st){st.textContent='Correct ✓';st.className='status ok'}if(celebrate)showBravo();return true}else{if(st){st.textContent='Il reste une erreur à corriger.';st.className='status bad'}return false}}
function clearExercise(card){card.querySelectorAll('input').forEach(i=>{if(i.classList.contains('answer-cell')||i.classList.contains('carry-cell')){i.value='';i.classList.remove('good','bad','active')}});const st=card.querySelector('.status');if(st){st.textContent='';st.className='status'}}
function showBravo(){const b=$('bravo');b.classList.remove('hidden');setTimeout(()=>b.classList.add('hidden'),850)}

function exerciseCard(ex,title='Calcul',guided=false){const el=document.createElement('div');el.className='exercise-card';el.innerHTML=`<div class="exercise-title">${title}</div><div class="written-wrap">${renderWritten(ex,true)}</div><div class="status"></div><div class="exercise-actions"><button class="btn btn-danger clear-one">Effacer</button><button class="btn btn-success check-one">Vérifier</button></div>`;bindDigits(el);el.querySelector('.check-one').onclick=()=>checkExercise(el);el.querySelector('.clear-one').onclick=()=>clearExercise(el);return el}

function renderMode(){const c=$('workContent');c.innerHTML='';if(state.mode==='guided')renderGuided(c);else if(state.mode==='board')renderBoard(c);else if(state.mode==='transcribe')renderTranscribe(c);else renderList(c)}
function renderGuided(c){const ex=genExercise();state.guided=ex;const p=document.createElement('div');p.className='panel work-panel';p.innerHTML=`<div class="instruction" id="guideInstruction"><strong>Commence par la colonne des unités.</strong>&nbsp; Avance case par case.</div>`;const card=exerciseCard(ex,'Calcul guidé',true);p.appendChild(card);const hint=document.createElement('div');hint.className='guide-hint';hint.id='guideHint';hint.textContent=guideText(ex,0);p.appendChild(hint);const row=document.createElement('div');row.className='guide-row';row.innerHTML=`<button class="btn btn-warn" id="guideStep">Valider l’étape</button><button class="btn btn-blue" id="guideShow">Afficher la réponse</button>`;p.appendChild(row);c.appendChild(p);const fields=[...card.querySelectorAll('.answer-cell[data-expected]')].filter(x=>x.dataset.expected!=='');fields.reverse();let idx=0;function activate(){fields.forEach(x=>x.classList.remove('active'));if(fields[idx]){fields[idx].classList.add('active');fields[idx].focus();hint.textContent=guideText(ex,idx)}}activate();row.querySelector('#guideStep').onclick=()=>{const f=fields[idx];if(!f)return;if(f.value===f.dataset.expected){f.classList.add('good');f.classList.remove('bad');idx++;if(idx>=fields.length){card.querySelector('.status').textContent='Calcul terminé ✓';card.querySelector('.status').className='status ok';showBravo();hint.textContent='Le calcul est terminé.';return}activate()}else{f.classList.add('bad');hint.textContent='Regarde bien la colonne active et recommence.'}};row.querySelector('#guideShow').onclick=()=>{fields.forEach(f=>{f.value=f.dataset.expected;f.classList.add('good');f.classList.remove('bad')});card.querySelector('.status').textContent='Réponse affichée';card.querySelector('.status').className='status ok'} }
function guideText(ex,idx){if(ex.multi)return idx<Math.max(1,String(ex.a*Number(String(ex.b).slice(-1))).length)?'Multiplie avec le chiffre des unités du multiplicateur.':'Continue les produits partiels, puis additionne-les.';if(ex.op==='add')return 'Additionne les chiffres de cette colonne. N’oublie pas le report s’il y en a un.';if(ex.op==='sub')return state.subMethod==='addBottom'?'Soustrais colonne par colonne. Si nécessaire, ajoute 10 en haut et un petit 1 en bas à gauche.':'Soustrais colonne par colonne. Si nécessaire, emprunte 1 au chiffre de gauche.';return state.mulMethod==='top'?'Multiplie d’abord les deux chiffres, puis ajoute le report éventuel.':'Multiplie d’abord, puis utilise le report conservé à côté.'}

function renderBoard(c){const wrap=document.createElement('div');wrap.className='panel work-panel';wrap.innerHTML=`<div class="instruction">Deux calculs pour le tableau. Les deux bonus en dessous sont plus rapides.</div><div class="board-two" id="boardTwo"></div><div class="bonus-area"><h3>Bonus pour les plus rapides</h3><div class="bonus-grid" id="bonusGrid"></div></div>`;c.appendChild(wrap);const two=wrap.querySelector('#boardTwo');[1,2].forEach(i=>two.appendChild(exerciseCard(genExercise(),`Calcul ${i}`)));const bg=wrap.querySelector('#bonusGrid');[1,2].forEach(i=>{const ex=genExercise();const b=document.createElement('div');b.className='bonus-card';b.innerHTML=`<div class="bonus-exp">${inlineText(ex)}</div><div class="bonus-controls"><input class="bonus-input" inputmode="numeric" placeholder="Réponse"><button class="btn btn-success bonus-check">Corriger</button><button class="btn btn-blue bonus-show">Afficher</button><span class="status"></span></div>`;const inp=b.querySelector('input'),st=b.querySelector('.status');b.querySelector('.bonus-check').onclick=()=>{if(Number(inp.value)===resultOf(ex)){st.textContent='✓';st.className='status ok';showBravo()}else{st.textContent='À revoir';st.className='status bad'}};b.querySelector('.bonus-show').onclick=()=>{inp.value=resultOf(ex);st.textContent='Réponse affichée';st.className='status ok'};bg.appendChild(b)})}

function renderTranscribe(c){const p=document.createElement('div');p.className='panel work-panel transcribe-box';p.innerHTML=`<div class="instruction">Écris le calcul que tu veux faire avec la classe, puis clique sur <strong>Démarrer</strong>.</div><div class="transcribe-form" id="transForm"></div><div class="guide-row"><button class="btn btn-success" id="startTrans">Démarrer</button></div><div id="transResult" class="transcribe-result"></div>`;c.appendChild(p);const f=p.querySelector('#transForm');buildTransForm(f);p.querySelector('#startTrans').onclick=()=>{const ex=readTransForm(f);if(!ex)return;const r=p.querySelector('#transResult');r.innerHTML='';r.appendChild(exerciseCard(ex,'Calcul retranscrit'));state.transcribed=ex}}
function buildTransForm(f){const fam=state.family;if(fam==='addmulti'){f.innerHTML=`<div class="multi-inputs" id="multiNums"><input class="big-input" inputmode="numeric" placeholder="Nombre 1"><input class="big-input" inputmode="numeric" placeholder="Nombre 2"><input class="big-input" inputmode="numeric" placeholder="Nombre 3"></div><button type="button" class="btn btn-blue" id="addTerm">+ Ajouter un nombre</button>`;f.querySelector('#addTerm').onclick=()=>{const g=f.querySelector('#multiNums');if(g.children.length>=6)return;const i=document.createElement('input');i.className='big-input';i.inputMode='numeric';i.placeholder=`Nombre ${g.children.length+1}`;g.appendChild(i)};return}const op= fam==='add'?'+':fam==='sub'?'−':fam==='mul'||fam==='mulmulti'?'×':'';f.innerHTML=`<input class="big-input" id="ta" inputmode="numeric" placeholder="Premier nombre">${fam==='mix'?'<select id="top" class="op-select"><option value="add">+</option><option value="sub">−</option><option value="mul">×</option></select>':`<div class="op-display">${op}</div>`}<input class="big-input" id="tb" inputmode="numeric" placeholder="Deuxième nombre">`}
function readTransForm(f){const fam=state.family;if(fam==='addmulti'){const terms=[...f.querySelectorAll('.big-input')].map(i=>Number(i.value)).filter(n=>Number.isInteger(n)&&n>=0);if(terms.length<2)return alert('Entre au moins deux nombres.'),null;return {op:'add',terms,family:'addmulti'}}const a=Number(f.querySelector('#ta').value),b=Number(f.querySelector('#tb').value);if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0)return alert('Entre deux nombres entiers positifs.'),null;let op=fam==='mix'?f.querySelector('#top').value:fam==='add'?'add':fam==='sub'?'sub':'mul';if(op==='sub'&&a<b)return alert('Pour cette version, le premier nombre doit être plus grand que le second.'),null;const ex=op==='add'?{op:'add',terms:[a,b],family:'add'}:{op,a,b,family:op==='sub'?'sub':fam};if(fam==='mulmulti'||(fam==='mix'&&op==='mul'&&String(b).length>1))ex.multi=true;return ex}

function renderList(c){state.list=Array.from({length:10},()=>genExercise());const p=document.createElement('div');p.className='panel list-panel';p.innerHTML=`<div class="list-tools"><button class="btn btn-blue" data-col="0">Corriger colonne 1</button><button class="btn btn-blue" data-col="1">Corriger colonne 2</button><button class="btn btn-success" id="showAllCols">Tout corriger</button><button class="btn btn-danger" id="hideSolutions">Masquer les corrections</button></div><div class="exercise-list"><div class="list-column" id="col0"></div><div class="list-column" id="col1"></div></div>`;c.appendChild(p);state.list.forEach((ex,i)=>{const col=i<5?0:1;const item=document.createElement('div');item.className='list-item';item.dataset.index=i;item.innerHTML=`<div class="list-line"><span class="list-index">${i+1}.</span><span>${inlineText(ex)}</span><input class="inline-input" inputmode="numeric" placeholder="réponse"></div><div class="solution-zone hidden"></div>`;const inp=item.querySelector('input');inp.addEventListener('change',()=>{inp.style.borderColor=Number(inp.value)===resultOf(ex)?'#61d596':'#ea6a7e'});p.querySelector(`#col${col}`).appendChild(item)});function toggleCol(col,show=true){const start=col*5;for(let i=start;i<start+5;i++){const item=p.querySelector(`[data-index="${i}"]`),z=item.querySelector('.solution-zone');if(!show){z.classList.add('hidden');z.innerHTML='';continue}const ex=state.list[i];z.innerHTML=`<div class="written-wrap">${renderWritten(ex,false)}</div><div class="solution-answer">Réponse : ${resultOf(ex)}</div>`;z.classList.remove('hidden')}}p.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>toggleCol(Number(b.dataset.col),true));p.querySelector('#showAllCols').onclick=()=>{toggleCol(0,true);toggleCol(1,true)};p.querySelector('#hideSolutions').onclick=()=>{toggleCol(0,false);toggleCol(1,false)}}

$('levelSelect').onchange=e=>{state.level=e.target.value;if(state.mode&&$('workScreen').classList.contains('hidden')===false){$('workBadge').textContent=levelLabel(state.level);renderMode()}};
$('settingsBtn').onclick=()=>{renderSettings();$('settingsModal').classList.remove('hidden')};$('closeSettings').onclick=()=>$('settingsModal').classList.add('hidden');$('settingsModal').addEventListener('click',e=>{if(e.target===$('settingsModal'))$('settingsModal').classList.add('hidden')});
document.querySelectorAll('.mode-card').forEach(b=>b.onclick=()=>openMode(b.dataset.mode));$('homeBtn').onclick=goHome;$('backModesBtn').onclick=backModes;$('newBtn').onclick=renderMode;$('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};

buildHub();show('hubScreen');
})();
</script>
